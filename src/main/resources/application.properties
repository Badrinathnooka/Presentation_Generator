spring.application.name=ai-presentation-generator
server.port=8080

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.chunking.max-chars=9000
app.chunking.overlap=500
app.llm.max-chunk-calls=8
app.llm.context-tokens=8192
app.presentation.default-slides=8
app.presentation.max-slides=15

# Local Ollama configuration. No API key is required.
# OLLAMA_BASE_URL=http://localhost:11434
# OLLAMA_MODEL=llama3:latest

# Visual enrichment. Images are fetched on-demand from Wikimedia Commons and added with a source footer.
app.visuals.image-enabled=true
app.visuals.user-agent=AI-Presentation-Generator/1.0 (local development)
